[project]
name = "learnstep-worker"
version = "0.1.0"
description = "Single-consumer local RAG worker for LearnStep"
requires-python = ">=3.12,<3.14"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "qdrant-client>=1.14,<2",
  "pymupdf>=1.25,<2",
  "python-docx>=1.1,<2",
  "python-dotenv>=1.1,<2",
  "tokenizers>=0.21,<1",
  "huggingface-hub>=0.30,<2"
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
learnstep-worker = "study_worker.main:main"
learnstep-evaluate = "study_worker.evaluate:main"
learnstep-benchmark = "study_worker.benchmark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/study_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
