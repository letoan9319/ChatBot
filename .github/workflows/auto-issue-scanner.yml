name: Automated Scan Issue Bot

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 1 * * 1,4"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan-and-sync-issues:
    name: Run scanners and sync GitHub Issues
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Setup uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Prepare report directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scan-reports"

      - name: Install verified Gitleaks binary
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Run Gitleaks scan (redacted JSON)
        shell: bash
        run: |
          set +e
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --log-opts="--all" \
            --report-format json --report-path "$RUNNER_TEMP/scan-reports/gitleaks.json" \
            >/dev/null 2>"$RUNNER_TEMP/scan-reports/gitleaks.stderr.txt"
          echo "$?" > "$RUNNER_TEMP/scan-reports/gitleaks.exit"

      - name: Run npm audit scan (JSON)
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json \
            >"$RUNNER_TEMP/scan-reports/npm-audit.json" \
            2>"$RUNNER_TEMP/scan-reports/npm-audit.stderr.txt"
          echo "$?" > "$RUNNER_TEMP/scan-reports/npm-audit.exit"

      - name: Export locked worker requirements and run pip-audit (JSON)
        shell: bash
        run: |
          set -euo pipefail
          uv export --directory services/worker --frozen --all-groups --no-emit-project \
            --format requirements-txt --output-file "$RUNNER_TEMP/worker-requirements.txt"
          set +e
          uv run --no-project --with-requirements .github/security-tools/requirements.txt \
            pip-audit --strict --require-hashes --format json -r "$RUNNER_TEMP/worker-requirements.txt" \
            >"$RUNNER_TEMP/scan-reports/pip-audit.json" \
            2>"$RUNNER_TEMP/scan-reports/pip-audit.stderr.txt"
          echo "$?" > "$RUNNER_TEMP/scan-reports/pip-audit.exit"

      - name: Run Bandit scan (JSON)
        shell: bash
        run: |
          set +e
          uv run --no-project --with-requirements .github/security-tools/requirements.txt \
            bandit -r services/worker/src --severity-level medium --confidence-level medium \
            --format json --output "$RUNNER_TEMP/scan-reports/bandit.json" \
            >/dev/null 2>"$RUNNER_TEMP/scan-reports/bandit.stderr.txt"
          echo "$?" > "$RUNNER_TEMP/scan-reports/bandit.exit"

      - name: Run zizmor workflow audit (JSON)
        shell: bash
        run: |
          set +e
          uv run --no-project --with-requirements .github/security-tools/requirements.txt \
            zizmor --offline --no-progress --format json --min-severity medium .github/workflows \
            >"$RUNNER_TEMP/scan-reports/zizmor.json" \
            2>"$RUNNER_TEMP/scan-reports/zizmor.stderr.txt"
          echo "$?" > "$RUNNER_TEMP/scan-reports/zizmor.exit"

      - name: Run Ruff lint check (JSON)
        shell: bash
        run: |
          set -euo pipefail
          uv sync --directory services/worker --frozen --python 3.12 --only-group dev --no-install-project
          set +e
          uv run --directory services/worker --no-sync \
            ruff check src tests --output-format json \
            >"$RUNNER_TEMP/scan-reports/ruff.json" \
            2>"$RUNNER_TEMP/scan-reports/ruff.stderr.txt"
          echo "$?" > "$RUNNER_TEMP/scan-reports/ruff.exit"

      - name: Sync scan findings to GitHub Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          SCAN_REPORTS_DIR: ${{ runner.temp }}/scan-reports
        run: node .github/scripts/sync-scan-issues.mjs
